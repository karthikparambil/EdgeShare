services:
  edgeshare:
    build: .
    container_name: edgeshare-server
    restart: unless-stopped
    # Using host network mode natively attaches the Docker container to your host computer's Wi-Fi
    # and Ethernet network interfaces, preventing Docker from generating isolated virtual IPs (172.17.x.x).
    network_mode: "host"
    environment:
      - PORT=9999
      - DOCKER=true
      # Optional: Explicitly override with a specific LAN / Wi-Fi IP address if you have multiple NIC cards:
      # - HOST_IP=192.168.1.100
    volumes:
      # Persist transferred files directly in your workspace uploads folder on the host system
      - ./uploads:/usr/src/app/uploads
