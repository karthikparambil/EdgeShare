<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Edgeshare</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div id="loginOverlay" class="login-overlay">
        <div class="login-box">
            <h2>Connecting...</h2>
            <p class="subtitle">Please wait</p>
            <p id="loginError" class="error-message" style="display: none;">Invalid passcode</p>
        </div>
    </div>

    <div id="waitingOverlay" class="login-overlay" style="display: none;">
        <div class="login-box">
            <h2>Waiting for Approval</h2>
            <p class="subtitle">The desktop server must approve your connection request before you can share files.</p>
            <div style="margin: 2rem auto 0; width: 40px; height: 40px; border: 4px solid var(--border-color); border-top-color: var(--primary-color); border-radius: 50%; animation: spin 1s linear infinite;"></div>
        </div>
    </div>

    <div class="container phone-container" id="mainApp" style="display: none;">
        <section class="history-section">
            <header>
                <h1>Edgeshare Receiver</h1>
                <p class="subtitle">Waiting for texts from desktop...</p>
            </header>
            <div class="message-list" id="messageList">
                <!-- Messages will appear here -->
            </div>
        </section>

        <section class="input-section">
            <input type="file" id="fileInput" style="display: none;" multiple>
            <textarea id="messageInput" placeholder="Type a message..."></textarea>
            <div id="uploadProgressContainer" style="display: none; margin-top: 0.5rem; margin-bottom: 0.5rem;">
                <div style="display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 6px; color: var(--text-secondary);">
                    <span id="uploadFileName" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 80%;">Uploading...</span>
                    <span id="uploadPercent">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="uploadProgressBar"></div>
                </div>
            </div>
            <div class="action-buttons">
                <button id="attachBtn" title="Attach File">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5a2.5 2.5 0 0 1 5 0v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5a2.5 2.5 0 0 0 5 0V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg>
                    Attach
                </button>
                <button id="sendBtn" class="primary">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                    Send
                </button>
            </div>
        </section>
    </div>

    <div id="dragOverlay" class="drag-overlay" style="display: none;">
        <div class="drag-content">
            <svg class="icon" viewBox="0 0 24 24" style="width: 64px; height: 64px; fill: white; margin-bottom: 1rem;"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.36 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
            <h2>Drop files to share</h2>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="receiver.js?v=2"></script>
</body>
</html>
